openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tts
    description: Text-to-speech operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tts:
    post:
      operationId: generateTextToSpeech
      tags: [tts]
      summary: Generate speech audio
      description: Converts assistant response text into browser-playable WAV audio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextToSpeechRequest"
      responses:
        "200":
          description: WAV audio generated by the configured speech provider
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid text
        "503":
          description: Text-to-speech provider is not configured
        "502":
          description: Text-to-speech provider failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TextToSpeechRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - text

